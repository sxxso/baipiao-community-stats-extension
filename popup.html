<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>白嫖社区个人统计</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main id="app" class="app" aria-busy="true">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="icons/icon.svg" alt="">
          <div>
            <p class="eyebrow">白嫖社区</p>
            <h1>个人数据</h1>
          </div>
        </div>
        <button
          id="refreshButton"
          class="icon-button"
          type="button"
          title="刷新数据"
          aria-label="刷新数据"
        >↻</button>
      </header>

      <div id="statePanel" class="state-panel" role="status" aria-live="polite" hidden>
        <span class="state-mark" aria-hidden="true"></span>
        <div>
          <strong id="stateTitle">正在读取</strong>
          <p id="stateMessage">正在读取社区数据…</p>
        </div>
      </div>

      <div id="updateBanner" class="update-banner" role="status" hidden>
        <div class="update-copy">
          <strong>发现新版本 <span id="updateVersion">—</span></strong>
          <p>下载后解压覆盖旧目录，再在扩展管理页重新加载即可。</p>
        </div>
        <div class="update-actions">
          <button id="updateDownloadButton" class="text-button" type="button">前往下载 ↗</button>
          <button id="updateDismissButton" class="text-button" type="button">知道了</button>
        </div>
      </div>

      <section id="profileSection" class="profile-section" aria-labelledby="profileHeading">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" alt="" hidden>
          <span id="avatarFallback" class="avatar-fallback" aria-hidden="true">?</span>
        </div>
        <div class="profile-copy">
          <div class="identity-row">
            <div>
              <h2 id="profileHeading"><span id="displayName">—</span></h2>
              <p id="handle" class="handle">@—</p>
            </div>
            <button id="openProfileButton" class="text-button" type="button" disabled>
              查看主页 <span aria-hidden="true">↗</span>
            </button>
          </div>
          <div class="profile-meta">
            <span id="trustLabel" class="pill">称号 —</span>
            <span>加入 <time id="joinedAt">—</time></span>
          </div>
        </div>
      </section>

      <section class="content-section stats-section" aria-labelledby="statsHeading">
        <div class="section-heading">
          <h2 id="statsHeading">社区轨迹</h2>
          <span id="updatedAt" class="updated-at">—</span>
        </div>
        <div id="statsGrid" class="stats-grid">
          <div class="stat-cell">
            <strong id="topicsValue">—</strong>
            <span>主题</span>
          </div>
          <div class="stat-cell">
            <strong id="repliesValue">—</strong>
            <span>回复</span>
          </div>
          <div class="stat-cell">
            <strong id="moneyValue">—</strong>
            <span>毛余额</span>
          </div>
          <div class="stat-cell level-stat">
            <strong id="levelValue">—</strong>
            <span>社区等级</span>
          </div>
        </div>
      </section>

      <section id="checkinSection" class="content-section checkin-section" aria-labelledby="checkinHeading" hidden>
        <div class="section-heading">
          <h2 id="checkinHeading">每日签到</h2>
          <span id="checkinNote" class="section-note"></span>
        </div>
        <div id="checkinCard" class="checkin-card">
          <div class="checkin-status">
            <span id="checkinState" class="checkin-state"></span>
            <strong id="checkinToday">—</strong>
          </div>
          <p id="checkinMeta" class="checkin-meta"></p>
          <p id="checkinBlocked" class="checkin-blocked" hidden></p>
        </div>
        <button id="openCheckinButton" class="text-button checkin-link" type="button">
          去签到页面 <span aria-hidden="true">↗</span>
        </button>
      </section>

      <section id="questsSection" class="content-section quests-section" aria-labelledby="questsHeading" hidden>
        <div class="section-heading">
          <h2 id="questsHeading">每日任务</h2>
          <span id="questsNote" class="section-note"></span>
        </div>
        <ol id="questsList" class="quests-list"></ol>
        <p id="questsEmpty" class="empty-note" hidden>暂无任务数据</p>
      </section>

      <section id="leaderboardSection" class="content-section leaderboard-section" aria-labelledby="leaderboardHeading" hidden>
        <div class="section-heading">
          <h2 id="leaderboardHeading">毛排行榜</h2>
          <span id="leaderboardNote" class="section-note"></span>
        </div>
        <div id="leaderboardMe" class="leaderboard-me" hidden></div>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
        <p id="leaderboardEmpty" class="empty-note" hidden>暂无排行榜数据</p>
      </section>

      <section id="trendSection" class="content-section trend-section" aria-labelledby="trendHeading">
        <div class="section-heading">
          <h2 id="trendHeading">近 7 天活跃</h2>
          <span class="section-note">按活动记录</span>
        </div>
        <div id="trendBars" class="trend-bars" aria-label="近七天活动数量"></div>
        <p id="trendEmpty" class="empty-note" hidden>暂无可用趋势数据</p>
      </section>

      <section class="content-section activity-section" aria-labelledby="activityHeading">
        <div class="section-heading">
          <h2 id="activityHeading">最近活动</h2>
          <span class="section-note">最多 5 条</span>
        </div>
        <ol id="activityList" class="activity-list"></ol>
        <p id="activityEmpty" class="empty-note" hidden>暂无活动记录</p>
      </section>

      <footer class="footer">
        <button id="openCommunityButton" class="footer-link" type="button">
          打开社区 <span aria-hidden="true">↗</span>
        </button>
        <span class="privacy-note">只读取当前登录会话</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
